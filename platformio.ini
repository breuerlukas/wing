[env:teensy]
platform = teensy
board = teensy40
framework = arduino
lib_deps =
  paulstoffregen/PWMServo@^2.1
  mikalhart/TinyGPSPlus@^1.1.0
  adafruit/Adafruit BMP280 Library@^2.6.8
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.2